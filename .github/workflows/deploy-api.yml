name: Deploy API to EC2 (Dev)

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "server.js"
      - "package.json"
      - "Dockerfile.dev"
      - ".github/workflows/deploy-api.yml"
  workflow_call:

env:
  APP_AWS_REGION: us-east-1
  APP_AWS_S3_BUCKET: healthify-uploads
  APP_SSM_CONFIG_PATH: /healthify/dev/config_v1
  DB_NAME: healthify_db_v1
  DB_USER: postgres
  DB_HOST: healthify-postgres-dev
  DB_PORT: 5432
  PORT: 3010
  USE_LOCAL_S3: false

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bootstrap - Get OIDC Role ARN from Parameter Store
        id: bootstrap
        run: |
          CONFIG=$(aws ssm get-parameter \
            --name ${{ env.APP_SSM_CONFIG_PATH }} \
            --query Parameter.Value \
            --output text \
            --region ${{ env.APP_AWS_REGION }})

          ROLE_ARN=$(echo "$CONFIG" | jq -r '.github.actionsRoleArn')
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_FOR_GITHUB }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_FOR_GITHUB }}

      - name: Login to AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.APP_AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      - name: Get Configuration from Parameter Store
        id: get-config
        run: |
          CONFIG=$(aws ssm get-parameter --name ${{ env.APP_SSM_CONFIG_PATH }} --query Parameter.Value --output text)

          export APP_AWS_REGION=$(echo "$CONFIG" | jq -r '.region')
          export EC2_INSTANCE_ID=$(echo "$CONFIG" | jq -r '.ec2.instanceId')
          export ECR_REPOSITORY_URL=$(echo "$CONFIG" | jq -r '.ecr.devRepositoryUrl')
          export EC2_DNS=$(echo "$CONFIG" | jq -r '.ec2.dns // .ec2.host')
          export API_DOMAIN=$(echo "$CONFIG" | jq -r '.domains.subdomains.api')

          echo "APP_AWS_REGION=$APP_AWS_REGION" >> $GITHUB_ENV
          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> $GITHUB_ENV
          echo "ECR_REPOSITORY_URL=$ECR_REPOSITORY_URL" >> $GITHUB_ENV
          echo "EC2_DNS=$EC2_DNS" >> $GITHUB_ENV
          echo "API_DOMAIN=$API_DOMAIN" >> $GITHUB_ENV

      - name: Build Docker image
        run: docker build -f Dockerfile.dev -t healthify-api:dev .

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $APP_AWS_REGION | docker login --username AWS --password-stdin $ECR_REPOSITORY_URL

      - name: Tag and Push to ECR
        run: |
          docker tag healthify-api:dev $ECR_REPOSITORY_URL:api
          docker push $ECR_REPOSITORY_URL:api

      - name: Deploy application
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[
              \"set -e\",
              \"echo 'Starting deployment...'\",
              \"aws ecr get-login-password --region '$APP_AWS_REGION' | docker login --username AWS --password-stdin '$ECR_REPOSITORY_URL'\",
              \"echo 'Stopping existing container...'\",
              \"docker stop healthify-api-dev 2>/dev/null || true\",
              \"docker rm healthify-api-dev 2>/dev/null || true\",
              \"docker rmi '$ECR_REPOSITORY_URL':api 2>/dev/null || true\",
              \"echo 'Pulling new image...'\",
              \"docker pull '$ECR_REPOSITORY_URL':api\",
              \"echo 'Creating network...'\",
              \"docker network create healthify-network 2>/dev/null || true\",
              \"echo 'Creating env file...'\",
              \"cat > /tmp/healthify-api.env << 'ENVEOF'\",
              \"PORT=${{ env.PORT }}\",
              \"DB_HOST=${{ env.DB_HOST }}\",
              \"DB_PORT=${{ env.DB_PORT }}\",
              \"DB_NAME=${{ env.DB_NAME }}\",
              \"DB_USER=${{ env.DB_USER }}\",
              \"DB_PASSWORD=${{ secrets.DB_PASSWORD }}\",
              \"SESSION_SECRET=${{ secrets.SESSION_SECRET }}\",
              \"JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}\",
              \"JWT_REFRESH_SECRET_KEY=${{ secrets.JWT_REFRESH_SECRET_KEY }}\",
              \"EMAIL_SENDING_RESEND_API_KEY=${{ secrets.EMAIL_SENDING_RESEND_API_KEY }}\",
              \"GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}\",
              \"GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}\",
              \"APP_AWS_REGION=${{ env.APP_AWS_REGION }}\",
              \"APP_AWS_ACCESS_KEY_ID_FOR_S3=${{ secrets.APP_AWS_ACCESS_KEY_ID_FOR_S3 }}\",
              \"APP_AWS_SECRET_ACCESS_KEY_FOR_S3=${{ secrets.APP_AWS_SECRET_ACCESS_KEY_FOR_S3 }}\",
              \"APP_AWS_S3_BUCKET=${{ env.APP_AWS_S3_BUCKET }}\",
              \"USE_LOCAL_S3=${{ env.USE_LOCAL_S3 }}\",
              \"ENVEOF\",
              \"echo 'Starting container...'\",
              \"docker run -d --restart unless-stopped --network healthify-network -p 3010:3010 --name healthify-api-dev -e ENABLE_SENTRY=true --env-file /tmp/healthify-api.env '$ECR_REPOSITORY_URL':api || { echo 'Failed to start container'; docker logs healthify-api-dev 2>&1 || true; exit 1; }\",
              \"sleep 5\",
              \"CONTAINER_STATE=\$(docker inspect --format='{{.State.Status}}' healthify-api-dev 2>/dev/null || echo 'not-found')\",
              \"if [ \\\"\$CONTAINER_STATE\\\" != \\\"running\\\" ]; then echo 'Container is not running. State:' \\\"\$CONTAINER_STATE\\\"; docker logs healthify-api-dev 2>&1 || true; exit 1; fi\",
              \"echo 'Cleaning up old images...'\",
              \"docker image prune -f\",
              \"echo 'Deployment completed successfully'\"
            ]" \
            --output text \
            --query 'Command.CommandId')

          echo "Waiting for command to complete (Command ID: $COMMAND_ID)..."

          # Wait for command with timeout handling
          if ! aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID" 2>&1; then
            echo "⚠️ Wait command failed, but checking command status..."
          fi

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text)

          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'StandardErrorContent' \
            --output text)

          EXIT_CODE=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'ResponseCode' \
            --output text)

          echo "=========================================="
          echo "Command Status: $STATUS"
          echo "Exit Code: $EXIT_CODE"
          echo "=========================================="
          echo "Standard Output:"
          echo "$OUTPUT"
          echo "=========================================="

          if [ "$ERROR_OUTPUT" != "None" ] && [ -n "$ERROR_OUTPUT" ]; then
            echo "Standard Error:"
            echo "$ERROR_OUTPUT"
            echo "=========================================="
          fi

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed: $STATUS (Exit Code: $EXIT_CODE)"
            exit 1
          fi

          echo "✅ Deployment successful"
          if [ -n "$API_DOMAIN" ] && [ "$API_DOMAIN" != "null" ]; then
            echo "🌐 API URL: https://$API_DOMAIN"
          else
            echo "🌐 API URL: http://$EC2_DNS:3010"
          fi
