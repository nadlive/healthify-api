name: Deploy PostgreSQL to EC2 (Dev)

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  manage-postgres:
    runs-on: ubuntu-latest
    environment:
      name: development

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Bootstrap - Get OIDC Role ARN from Parameter Store
        id: bootstrap
        run: |
          CONFIG=$(aws ssm get-parameter \
            --name /healthify/dev/config_v1 \
            --query Parameter.Value \
            --output text \
            --region ${{ secrets.APP_AWS_REGION }})

          ROLE_ARN=$(echo "$CONFIG" | jq -r '.github.actionsRoleArn // "arn:aws:iam::730335216789:role/healthify-github-actions-role"')
          echo "ROLE_ARN=$ROLE_ARN" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_FOR_GITHUB }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_FOR_GITHUB }}

      - name: Login to AWS via OIDC (Full Permissions)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ secrets.APP_AWS_REGION }}
          role-session-name: GitHubActionsDeploy

      - name: Get Configuration from Parameter Store
        id: get-config
        run: |
          CONFIG=$(aws ssm get-parameter --name /healthify/dev/config_v1 --query Parameter.Value --output text)

          export APP_AWS_REGION=$(echo "$CONFIG" | jq -r '.region')
          export EC2_INSTANCE_ID=$(echo "$CONFIG" | jq -r '.ec2.instanceId')

          echo "APP_AWS_REGION=$APP_AWS_REGION" >> $GITHUB_ENV
          echo "EC2_INSTANCE_ID=$EC2_INSTANCE_ID" >> $GITHUB_ENV

      - name: Deploy PostgreSQL
        run: |
          docker build -t healthify-db-setup ./setup-db
          docker run --rm \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN \
            -e APP_AWS_REGION=$APP_AWS_REGION \
            -e EC2_INSTANCE_ID=$EC2_INSTANCE_ID \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            healthify-db-setup
